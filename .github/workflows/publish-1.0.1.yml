name: Bootstrap authorized v1.0.1 release
on:
  workflow_run:
    workflows: ['Build and publish Windows release']
    types: [completed]
    branches: [main]
permissions:
  contents: write
  actions: write
jobs:
  tag-and-dispatch:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_commit.message == 'Release Desktop Clock v1.0.1'
    runs-on: ubuntu-latest
    steps:
      - name: Tag tested commit and explicitly dispatch tag build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          existing=$(gh api "repos/$GH_REPO/git/ref/tags/v1.0.1" --jq '.object.sha' 2>/dev/null) || existing=''
          if [ -n "$existing" ]; then
            test "$existing" = "$TESTED_SHA"
          else
            gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/v1.0.1 -f sha="$TESTED_SHA"
          fi
          gh workflow run release.yml --ref v1.0.1

