name: Build and publish Windows release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clock-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CLOCK_GUI_TESTS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Check version
        shell: pwsh
        run: |
          $version = python -c "from desktop_clock import __version__; print(__version__)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and application version differ' }
          "CLOCK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - name: Verify real Tk window
        run: python -m desktop_clock --smoke-test
      - run: python tools/generate_icon.py
      - run: pyinstaller --clean --noconfirm DesktopClock.spec
      - name: Verify packaged GUI and Windows version
        shell: pwsh
        run: |
          $process = Start-Process -FilePath '.\dist\DesktopClock.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) { Stop-Process -Id $process.Id -Force; throw 'GUI smoke test timed out' }
          if ($process.ExitCode -ne 0) { throw "GUI smoke test failed: $($process.ExitCode)" }
          if ((Get-Item '.\dist\DesktopClock.exe').VersionInfo.ProductVersion -ne $env:CLOCK_VERSION) { throw 'Windows version mismatch' }
      - name: Prepare portable artifact
        shell: pwsh
        run: |
          $name = "DesktopClock-v$env:CLOCK_VERSION-windows-x64"
          Move-Item -LiteralPath '.\dist\DesktopClock.exe' -Destination ".\dist\$name.exe"
          $hash = (Get-FileHash ".\dist\$name.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.exe" | Set-Content -Encoding ascii ".\dist\$name.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-portable
          path: dist/*
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: windows-portable
          path: dist
      - name: Publish immutable tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Desktop Clock $RELEASE_TAG / 桌面时钟" --notes "Windows 10/11 x64 portable clock. 下载 EXE 直接运行，无需 Python。Unsigned / 未签名。Fixes monitor positioning and immutable versioned releases / 修复多显示器位置及版本发布。"
