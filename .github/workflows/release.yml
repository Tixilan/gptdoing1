name: Build and publish Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify Windows Tk runtime
        run: python -c "import tkinter as tk; runtime = tk.Tcl(); print(runtime.eval('info patchlevel'))"
      - name: Generate application icon
        run: python tools/generate_icon.py
      - name: Build portable executable
        run: pyinstaller --clean --noconfirm DesktopClock.spec
      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\dist\DesktopClock.exe" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged application smoke test failed with exit code $($process.ExitCode)." }
      - name: Name artifact and write checksum
        shell: pwsh
        run: |
          $artifact = "DesktopClock-v1.0.0-windows-x64.exe"
          Move-Item -LiteralPath ".\dist\DesktopClock.exe" -Destination ".\dist\$artifact"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath ".\dist\$artifact").Hash.ToLower()
          "$hash  $artifact" | Set-Content -Encoding ascii ".\dist\DesktopClock-v1.0.0-windows-x64.sha256"
      - name: Publish v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: Desktop Clock v1.0.0 / 桌面时钟 v1.0.0
          make_latest: true
          overwrite_files: true
          body: |
            Windows 10/11 x64 portable desktop clock. No Python installation is required.

            Windows 10/11 x64 便携版桌面时钟，无需安装 Python。

            Download the `.exe`, optionally verify it with the `.sha256` file, and run it directly.
            下载 `.exe` 后可使用 `.sha256` 文件校验，随后直接运行。此版本尚未进行代码签名，Windows SmartScreen 可能显示提示。
          files: |
            dist/DesktopClock-v1.0.0-windows-x64.exe
            dist/DesktopClock-v1.0.0-windows-x64.sha256

